name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:
  # Weekly, against main with no commit: CI installs the newest Go patch
  # (check-latest) and runs golangci-lint `latest`, so main can go red without
  # a change here.
  # A Go patch or a linter release adds a finding, and without this run the
  # first job to notice is whichever PR happens to come next (usually a
  # Dependabot one), which then fails for a reason that is not its own.
  schedule:
    - cron: '47 4 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # go-version-file, not a literal: go.mod already states the floor, and a
      # second copy in this file could only fall out of step with it. Every job
      # reads the same source, so lint, test and build cannot disagree.
      #
      # check-latest costs roughly 20s a job and buys the patch version. go.mod
      # names a minor with no patch, and without the flag the action resolves
      # that against the runner image's pre-baked tool cache and stops —
      # `Found in cache @ /opt/hostedtoolcache/go/1.26.x/x64` — never asking
      # whether a newer patch exists. That pins the toolchain to whatever
      # GitHub last baked into the image, which this repository cannot see or
      # influence, and stdlib security fixes land in those patches.
      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          # latest, not a pinned release: the config tracks current golangci-lint
          # (see the gofumpt note in .golangci.yml), the same as local runs.
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Run unit tests
        run: task test:coverage

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-profile: coverage.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Build
        run: task build
